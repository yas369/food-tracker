name: Android APK

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install Capacitor
        run: npm ci

      - name: Check the bundled Capacitor runtime matches the installed one
        run: cmp node_modules/@capacitor/core/dist/capacitor.js www/capacitor.js

      - name: Copy the web app into the Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease -PversionCode=${{ github.run_number }} --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk plate-check.apk

      - uses: actions/upload-artifact@v4
        with:
          name: plate-check-apk
          path: plate-check.apk

      # On main, publish a release so the latest APK is always at
      # https://github.com/<owner>/<repo>/releases/latest/download/plate-check.apk
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" plate-check.apk \
            --title "Plate Check 1.0.${{ github.run_number }}" \
            --notes "Install on Android: open this page on your phone, tap plate-check.apk, then allow installing from your browser if asked. Updates install over the previous version and keep your data." \
            --latest
