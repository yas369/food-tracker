name: Android APK

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # The build number keeps rising past the earlier (web-based) version's,
      # so this installs over it as an update and keeps its data.
      - name: Build APK
        run: flutter build apk --release --build-number=$((1000 + ${{ github.run_number }})) --build-name=2.0.${{ github.run_number }}

      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk plate-check.apk

      - uses: actions/upload-artifact@v4
        with:
          name: plate-check-apk
          path: plate-check.apk

      # On main, publish a release so the latest APK is always at
      # https://github.com/<owner>/<repo>/releases/latest/download/plate-check.apk
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v2.0.${{ github.run_number }}" plate-check.apk \
            --title "Plate Check 2.0.${{ github.run_number }}" \
            --notes "Install on Android: open this page on your phone, tap plate-check.apk, then allow installing from your browser if asked. Updates install over the previous version and keep your data." \
            --latest
